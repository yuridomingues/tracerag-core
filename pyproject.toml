[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracerag-core"
version = "0.2.0"
description = "Evaluation-first RAG core with traceable retrieval, abstention and regression tests"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "openai==1.40.6",
    "pydantic-settings==2.6.1",
    "sentence-transformers==3.0.1",
    "chromadb==0.5.5",
    "pytest==8.3.2",
    "httpx==0.27.0",
    "requests==2.32.3",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
